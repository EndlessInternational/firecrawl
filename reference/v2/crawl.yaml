openapi: 3.0.0
info: { title: Firecrawl API, version: v2 }
servers: [{ url: https://api.firecrawl.dev/v2 }]
security: [{ bearerAuth: [] }]
paths:
  /crawl:
    post:
      tags: [Crawling]
      summary: Start an async crawl job
      operationId: crawlUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                prompt: { type: string, description: Natural language crawl prompt }
                includePaths: { type: array, items: { type: string } }
                excludePaths: { type: array, items: { type: string } }
                maxDiscoveryDepth: { type: integer }
                sitemap: { type: string, enum: [skip, include, only], default: include }
                ignoreQueryParameters: { type: boolean, default: false }
                limit: { type: integer, default: 10000 }
                scrapeOptions:
                  type: object
                  description: Scrape options applied to each crawled page (see /scrape)
                  additionalProperties: true
      responses:
        '200': { description: Crawl job created }
        '402': { description: Payment required }
        '429': { description: Too many requests }
        '500': { description: Server error }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
