openapi: 3.0.0
info: { title: Firecrawl API, version: v2 }
servers: [{ url: https://api.firecrawl.dev/v2 }]
security: [{ bearerAuth: [] }]
paths:
  /crawl/params-preview:
    post:
      tags: [Crawling]
      summary: Preview crawl parameters generated from a natural-language prompt
      operationId: crawlParamsPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, prompt]
              properties:
                url: { type: string, format: uri }
                prompt: { type: string, maxLength: 10000 }
      responses:
        '200': { description: Generated crawl parameters }
        '400': { description: Bad request }
        '402': { description: Payment required }
        '429': { description: Too many requests }
        '500': { description: Server error }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
