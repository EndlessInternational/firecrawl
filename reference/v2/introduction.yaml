# Non-OpenAPI summary extracted from the v2 introduction page.
# (This page does not embed an OpenAPI operation block.)

doc:
  source: https://docs.firecrawl.dev/api-reference/v2-introduction.md
  topic: introduction
api:
  host: https://api.firecrawl.dev
  version_path_hint: /v2
  auth:
    type: bearer
    header: Authorization
    format: "Bearer <API_KEY>"
http_status_codes:
  "200": Request was successful
  "400": Verify the correctness of the parameters
  "401": The API key was not provided (or invalid)
  "402": Payment required
  "404": The requested resource could not be located
  "429": The rate limit has been surpassed
  "5xx": Server error
rate_limit:
  described: true
  details_provided: false
features:
  - scrape
  - batch_scrape
  - crawl
  - map
  - search
  - extract
