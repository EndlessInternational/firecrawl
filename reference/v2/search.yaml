openapi: 3.0.0
info: { title: Firecrawl API, version: v2 }
servers: [{ url: https://api.firecrawl.dev/v2 }]
security: [{ bearerAuth: [] }]
paths:
  /search:
    post:
      tags: [Search]
      summary: Web search with optional scraping of results
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                limit: { type: integer }
                country: { type: string, description: ISO country code (e.g., US, DE) }
                location: { type: string, description: Human-readable location string }
                categories:
                  type: array
                  items: { type: string, enum: [github, research, pdf] }
                scrapeOptions:
                  type: object
                  description: Scrape options applied to each search result URL
                  additionalProperties: true
      responses:
        '200': { description: Search results }
        '402': { description: Payment required }
        '429': { description: Too many requests }
        '500': { description: Server error }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
